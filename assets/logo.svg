      <stop offset="0" stop-color="#1b8fd1"/>
      <stop offset="1" stop-color="#14c6a5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Device silhouette (Airthings-style puck) -->
